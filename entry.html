 <!DOCTYPE html>

<style>
    /* ===================================
      DAILY ENTRY PAGE UI
=================================== */


.entry-page{

    width:90%;

    max-width:900px;

    margin:40px auto;

    background:white;

    padding:35px;

    border-radius:20px;

    box-shadow:0 10px 25px rgba(0,0,0,.08);

}



.entry-page h1{

    font-size:32px;

    margin-bottom:30px;

    color:#1e293b;

}



.entry-page h2{

    margin-top:30px;

    margin-bottom:20px;

    color:#2563eb;

}


/* SELECT BOX */


#workerSelect{


    width:100%;

    padding:15px;

    border:1px solid #cbd5e1;

    border-radius:12px;

    font-size:16px;

    outline:none;

    background:#f8fafc;

    cursor:pointer;

    transition:.3s;

}



#workerSelect:focus{

    border-color:#2563eb;

    background:white;

}



/* INPUT */


#workAmount{


    width:100%;

    padding:15px;

    border:1px solid #cbd5e1;

    border-radius:12px;

    font-size:16px;

    outline:none;

    margin-top:15px;

    transition:.3s;

}



#workAmount:focus{

    border-color:#2563eb;

    background:#fff;

}



/* BUTTON */


#saveEntry{

    margin-top:20px;

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:#2563eb;

    color:white;

    font-size:17px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

}



#saveEntry:hover{

    background:#1d4ed8;

    transform:translateY(-3px);

}



/* LINE */


.entry-page hr{

    margin:35px 0;

    border:none;

    border-top:1px solid #e2e8f0;

}



/* ENTRY LIST */


#entryList{

    background:#f8fafc;

    min-height:120px;

    padding:20px;

    border-radius:15px;

    border:1px solid #e2e8f0;

}



#entryList p{

    color:#64748b;

    text-align:center;

}



/* ===================================
        MOBILE
=================================== */


@media(max-width:600px){


.entry-page{

    width:92%;

    padding:25px;

    margin-top:25px;

}



.entry-page h1{

    font-size:24px;

}



#saveEntry{

    font-size:15px;

}


}







/* ==========================
   Entry Card Professional UI
========================== */

.entry-card{
    background:#ffffff;
    border-radius:20px;
    padding:22px;
    margin:18px 0;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    border-left:6px solid #2563eb;
    transition:.3s ease;
}

.entry-card:hover{
    transform:translateY(-4px);
    box-shadow:0 18px 35px rgba(0,0,0,.12);
}

.entry-card h3{
    margin:0;
    font-size:24px;
    font-weight:700;
    color:#1e293b;
    text-align:center;
}

.entry-card p{
    margin:12px 0;
    text-align:center;
    color:#64748b;
    font-size:15px;
    font-weight:500;
    letter-spacing: 2px;
}

.entry-card h2{
    margin:0;
    text-align:center;
    font-size:34px;
    /* color:#2563eb; */
    /* font-weight:700; */
}

.entry-card button{
    margin-top:20px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#ef4444;
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.entry-card button:hover{
    background:#dc2626;
    transform:scale(1.02);
}

/* Different Color Cards */

.entry-card:nth-child(4n+1){
    border-left-color:#2563eb;
}

.entry-card:nth-child(4n+2){
    border-left-color:#16a34a;
}

.entry-card:nth-child(4n+3){
    border-left-color:#ea580c;
}

.entry-card:nth-child(4n+4){
    border-left-color:#9333ea;
}

/* Mobile */

@media(max-width:768px){

.entry-card{
    padding:18px;
}

.entry-card h3{
    font-size:20px;
}

.entry-card h2{
    font-size:28px;
}

}
</style>
