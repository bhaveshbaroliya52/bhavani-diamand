 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Workers</title>

    <link rel="stylesheet" href="style.css">
</head>
<style>
    /* =====================================
      WORKERS PAGE - MOBILE FIRST
===================================== */


.workers-page{

    width:92%;

    margin:30px auto;

}


/* TITLE */

.workers-page > h1{

    font-size:26px;

    color:#1e293b;

    margin-bottom:25px;

}



/* ===============================
    ADD WORKER CARD
================================ */


.add-worker{

    background:white;

    padding:25px;

    border-radius:18px;

    box-shadow:0 10px 25px rgba(0,0,0,.08);

    margin-bottom:30px;

}


.add-worker h2{

    font-size:20px;

    margin-bottom:20px;

    color:#2563eb;

}



/* INPUT */


#workerName{

    width:100%;

    padding:15px;

    border:1px solid #cbd5e1;

    border-radius:12px;

    font-size:16px;

    outline:none;

    margin-bottom:15px;

    background:#f8fafc;

}



#workerName:focus{

    border-color:#2563eb;

    background:white;

}



/* BUTTON */


#addWorkerBtn{

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:#2563eb;

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

}



#addWorkerBtn:hover{

    background:#1d4ed8;

}



/* ===============================
    WORKER LIST
================================ */


.worker-list{

    background:white;

    padding:25px;

    border-radius:18px;

    box-shadow:0 10px 25px rgba(0,0,0,.08);

}



.worker-list h2{

    color:#2563eb;

    font-size:20px;

    margin-bottom:20px;

}



/* WORKER ITEM
   JS thi generate thase
*/


.worker-card{

    background:#f8fafc;

    padding:18px;

    border-radius:14px;

    margin-bottom:15px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    border:1px solid #e2e8f0;

}



.worker-card h3{

    font-size:16px;

}



/* DELETE BUTTON JO HOY TO */

.worker-card button{

    background:#ef4444;

    color:white;

    border:none;

    padding:8px 12px;

    border-radius:8px;

    cursor:pointer;

}



/* ===============================
        TABLET
================================ */


@media(min-width:768px){


.workers-page{

    width:85%;

}


.add-worker{

    display:flex;

    align-items:center;

    gap:15px;

}



.add-worker h2{

    margin:0;

    flex:1;

}



#workerName{

    width:40%;

    margin:0;

}



#addWorkerBtn{

    width:180px;

}



}



/* ===============================
        DESKTOP
================================ */


@media(min-width:1200px){


.workers-page{

    max-width:1100px;

}



.workers-page > h1{

    font-size:34px;

}



}
</style>
