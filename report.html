 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports</title>

    <link rel="stylesheet" href="style.css">
</head>
<style>
    /* =====================================
        REPORT PAGE - MOBILE FIRST
===================================== */


.report-page{

    width:92%;

    margin:30px auto;

}


/* TITLE */

.report-page h1{

    font-size:26px;

    color:#1e293b;

    margin-bottom:25px;

}



/* REPORT CONTAINER */


#reportContainer{

    background:white;

    padding:20px;

    border-radius:18px;

    box-shadow:0 10px 25px rgba(0,0,0,.08);

}



/* REPORT CARD
   JS thi generate thase
*/


.report-card{

    background:#f8fafc;

    border:1px solid #e2e8f0;

    border-radius:15px;

    padding:20px;

    margin-bottom:15px;

    transition:.3s;

}



.report-card:hover{

    transform:translateY(-5px);

    box-shadow:0 8px 20px rgba(0,0,0,.08);

}



.report-card h3{

    color:#2563eb;

    font-size:18px;

    margin-bottom:12px;

}



.report-card p{

    color:#475569;

    margin:8px 0;

    font-size:15px;

}



/* SALARY AMOUNT */


.salary{

    margin-top:15px;

    padding:12px;

    background:#dcfce7;

    color:#15803d;

    border-radius:10px;

    font-weight:700;

    text-align:center;

}



/* EMPTY MESSAGE */


#reportContainer p{

    text-align:center;

    color:#64748b;

    padding:25px;

}



/* =====================================
        TABLET
===================================== */


@media(min-width:768px){


.report-page{

    width:85%;

}



#reportContainer{

    padding:30px;

}



}
 .worker-card:nth-child(5n+1){
    background:#DBEAFE;
}

.worker-card:nth-child(5n+2){
    background:#DCFCE7;
}

.worker-card:nth-child(5n+3){
    background:#F3E8FF;
}

.worker-card:nth-child(5n+4){
    background:#FFEDD5;
}

.worker-card:nth-child(5n){
    background:#FEE2E2;
}



/* =====================================
        DESKTOP
===================================== */


@media(min-width:1200px){


.report-page{

    max-width:1100px;

}



.report-page h1{

    font-size:34px;

}



#reportContainer{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:20px;

}



.report-card{

    margin:0;

}


}

.worker-card{
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(18px);
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
}

.worker-top{
    display:flex;
    align-items:center;
    gap:15px;
}

.worker-avatar{
    width:60px;
    height:60px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    background:#4f46e5;
}

.salary-box{
    margin-top:20px;
    padding:15px;
    border-radius:15px;
    background:rgba(255,255,255,.05);
}

.salary-box span{
    color:#aaa;
}

.salary-box h3{
    margin-top:5px;
    color:#00d26a;
}
</style>

<body>
 


 <header class="header">

    <div class="logo">
        <span>💎</span>
        <h2>Bhavani Diamond</h2>
    </div>

   <button class="menu-btn" id="menuBtn">
    ☰
</button>

    <nav class="nav-links">

        <a href="index.html">Dashboard</a>
        <a href="workers.html">Workers</a>
        <a href="entry.html">Entry</a>
        <a href="report.html">Reports</a>

    </nav>

    <div class="manager-area">

        <span class="manager-name">
            👤 Manager
        </span>

        <button id="logoutBtn">
            Logout
        </button>

    </div>

<div class="mobile-sidebar" id="mobileSidebar">

    <a href="index.html">🏠 Dashboard</a>

    <a href="workers.html">👷 Workers</a>

    <a href="entry.html">📝 Daily Entry</a>

    <a href="report.html">📊 Reports</a>

    <button id="mobileLogout">
        🚪 Logout
    </button>

</div>

<div class="overlay" id="overlay"></div>

</header>

<main class="report-page">

    <h1>Salary Report</h1>

    <div id="reportContainer">

    </div>

</main>

<script src="report.js"></script>

</body>
</html>
